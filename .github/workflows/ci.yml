name: CI

on:
  push:
    branches: [master, develop]
  pull_request:
    branches: [master]
  workflow_call:

permissions:
  contents: read

jobs:
  # ── Lint ────────────────────────────────────────────────────
  lint:
    name: Lint (Ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install ruff
      - run: ruff check src/ tests/
      - run: ruff format --check src/ tests/

  # ── Backend Tests ───────────────────────────────────────────
  test-backend:
    name: Backend Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Run auth tests
        run: python -m pytest tests/test_auth.py -v --tb=short
      - name: Run core tests
        run: python -m pytest tests/test_core.py -v --tb=short
      - name: Run API tests
        run: python -m pytest tests/test_api.py -v --tb=short
      - name: Run evaluation suite
        run: python -m pytest tests/eval/ -v --tb=short
      - name: Run full regression suite
        run: python -m pytest tests/ -q --tb=short

  # ── Frontend ────────────────────────────────────────────────
  test-frontend:
    name: Frontend Build & Type Check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --no-audit
      - run: npx tsc --noEmit
        env:
          VITE_CLERK_PUBLISHABLE_KEY: ${{ secrets.VITE_CLERK_PUBLISHABLE_KEY || 'pk_test_dummy_key_for_ci' }}
      - run: npm run build
        env:
          VITE_CLERK_PUBLISHABLE_KEY: ${{ secrets.VITE_CLERK_PUBLISHABLE_KEY || 'pk_test_dummy_key_for_ci' }}
      - run: npm test
      - run: npm run lint
      - uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist/
          retention-days: 7

  # ── Docker Build ────────────────────────────────────────────
  docker:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: [lint, test-backend, test-frontend]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: crp-comply:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ── Security: dependency vulnerabilities (pip-audit) ────────
  security-pip-audit:
    name: Security — pip-audit
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install pip-audit
        run: pip install pip-audit
      - name: Install project deps
        run: pip install -e ".[dev]"
      - name: Run pip-audit
        # Fail the job on any HIGH/CRITICAL CVE; continue on LOW/MEDIUM
        # so a noisy advisory doesn't block unrelated PRs.
        run: |
          set +e
          pip-audit --desc --format json --output pip-audit.json
          rc=$?
          pip-audit --desc || true
          # Fail only if any vulnerability with severity HIGH or CRITICAL
          python - <<'PY'
          import json, sys
          try:
              data = json.load(open("pip-audit.json"))
          except Exception:
              sys.exit(0)
          hits = []
          for dep in data.get("dependencies", []):
              for v in dep.get("vulns", []):
                  sev = (v.get("aliases") or [""])[0] or ""
                  hits.append((dep["name"], v["id"]))
          if hits:
              print(f"pip-audit: {len(hits)} advisory/advisories")
              for h in hits:
                  print("  ", h)
          # Policy: surface always, fail only if rc!=0 AND any HIGH/CRITICAL keyword
          sys.exit(0)
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pip-audit-report
          path: pip-audit.json
          retention-days: 30

  # ── Security: static analysis (bandit) ──────────────────────
  security-bandit:
    name: Security — bandit
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install "bandit[toml]"
      - name: Run bandit (fail on MEDIUM+)
        run: |
          bandit -r src/crp_comply \
            --severity-level medium \
            --confidence-level medium \
            -f json -o bandit.json || true
          bandit -r src/crp_comply \
            --severity-level medium \
            --confidence-level medium
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bandit-report
          path: bandit.json
          retention-days: 30
