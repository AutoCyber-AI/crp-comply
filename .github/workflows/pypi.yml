# Publish crp-comply and crp-comply-sdk to PyPI on release.
#
# Preferred: PyPI trusted publishing. Add a pending publisher in PyPI for each
# package with these claims:
#
#   Owner:       Constantinos-uni
#   Repo:        crp-comply
#   Workflow:    pypi.yml
#   Environment: pypi
#
# Fallback: set the PYPI_API_TOKEN repository secret and the workflow will use
# API-token publishing instead.

name: Publish to PyPI

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  publish-main:
    name: Publish crp-comply
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/crp-comply
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install build tools
        run: python -m pip install --upgrade pip build

      - name: Build package
        run: python -m build

      - name: Detect PyPI API token
        id: token
        run: |
          if [ -n "${PYPI_API_TOKEN}" ]; then
            echo "has_token=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_token=false" >> "$GITHUB_OUTPUT"
          fi
        env:
          PYPI_API_TOKEN: ${{ secrets.PYPI_API_TOKEN }}

      - name: Publish to PyPI (API token)
        if: steps.token.outputs.has_token == 'true'
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist
          password: ${{ secrets.PYPI_API_TOKEN }}

      - name: Publish to PyPI (trusted publishing)
        if: steps.token.outputs.has_token != 'true'
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist

  publish-sdk:
    name: Publish crp-comply-sdk
    runs-on: ubuntu-latest
    needs: publish-main
    environment:
      name: pypi
      url: https://pypi.org/p/crp-comply-sdk
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install build tools
        run: python -m pip install --upgrade pip build

      - name: Build SDK package
        working-directory: sdk
        run: python -m build

      - name: Detect PyPI API token
        id: token
        run: |
          if [ -n "${PYPI_API_TOKEN}" ]; then
            echo "has_token=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_token=false" >> "$GITHUB_OUTPUT"
          fi
        env:
          PYPI_API_TOKEN: ${{ secrets.PYPI_API_TOKEN }}

      - name: Publish SDK to PyPI (API token)
        if: steps.token.outputs.has_token == 'true'
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: sdk/dist
          password: ${{ secrets.PYPI_API_TOKEN }}
          skip-existing: true

      - name: Publish SDK to PyPI (trusted publishing)
        if: steps.token.outputs.has_token != 'true'
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: sdk/dist
          skip-existing: true
