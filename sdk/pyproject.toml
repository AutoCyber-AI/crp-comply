[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "crp-comply-sdk"
version = "4.6.0"
description = "Python SDK for CRP-Comply — EU AI Act & GDPR compliance automation (CRPv5 / agentic positioning)"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [
    { name = "Constantinos Vidiniotis" },
    { name = "AutoCyber AI Pty Ltd" },
]
maintainers = [
    { name = "Constantinos Vidiniotis" },
]
requires-python = ">=3.9"
dependencies = [
    "httpx>=0.25",
]
keywords = ["compliance", "eu-ai-act", "gdpr", "dpia", "audit", "llm"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Security",
]

[project.optional-dependencies]
worker = [
    "websockets>=12.0",
]

[project.scripts]
crp-comply = "crp_comply_sdk.worker:main"

[project.urls]
Homepage = "https://comply.crprotocol.io"
Documentation = "https://comply.crprotocol.io/app/sdk"
Repository = "https://github.com/AutoCyber-AI/crp-comply"
Issues = "https://github.com/AutoCyber-AI/crp-comply/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
crp_comply_sdk = ["py.typed"]
