case_id: gdpr_art22_automated_loan_decision
task: |
  We run an EU consumer-lending platform. Loans up to €5k are decided
  fully automatically by a credit-scoring model, with no human review
  unless the applicant complains. What are our GDPR obligations and
  what must we put in the privacy notice?
