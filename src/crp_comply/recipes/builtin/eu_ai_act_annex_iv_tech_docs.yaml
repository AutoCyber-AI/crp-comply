recipe_id: eu_ai_act_annex_iv_tech_docs
title: EU AI Act — Technical Documentation (Art. 11 + Annex IV)
regulation: EU AI Act — Regulation (EU) 2024/1689
version: "1.0"
description: >-
  Providers of high-risk AI systems must draw up the technical
  documentation before the system is placed on the market or put into
  service, per Article 11, and keep it up-to-date. The minimum
  content is fixed by Annex IV. This is the single most important
  evidence artefact for conformity assessment.
required_inputs:
  - provider
  - system_id
  - version
  - intended_purpose
  - annex_iii_row
ckf_queries:
  - "architecture and model cards for this system"
  - "prior Annex IV revisions"
  - "conformity assessment findings for this version"
tools_allowed:
  - query_regulation
  - query_regulation_packed
  - classify_ai_act_risk
  - recall_facts
  - lookup_article
  - lookup_annex
tags: [ai_act, annex_iv, art11, technical_documentation, conformity, high_risk]
output_format: both
output_artefacts:
  - Technical Documentation (Art. 11 + Annex IV)
applicability:
  purpose: >-
    The Annex IV technical documentation is the single evidence binder
    that proves a high-risk AI system conforms with Chapter III §2.
    Providers must draw it up before the system is placed on the market
    or put into service, and keep it up to date through the lifecycle.
  triggers:
    - "Before placing a high-risk AI system on the EU market"
    - "Before putting a high-risk AI system into service"
    - "Upon every substantial modification (Art 43(4))"
  deadline: "Before placement on market / putting into service"
  actors: [provider]
  applies_when:
    - "actor=provider"
    - "is_high_risk"
  not_applicable_when:
    - "actor=deployer"
    - "actor=distributor"
    - "actor=importer"
    - "system_category=minimal_risk"
  ask_when_unknown:
    actor:
      question: "Which role does your organisation play for this AI system \u2014 provider, deployer,\
  \ importer, distributor, authorised representative, or GPAI provider?"
      context: "Many EU AI Act obligations land on specific roles; the wrong actor classification\
  \ will mis-apply this recipe."
      priority: high
      fact_key: actor
      citation: "EU AI Act Art. 3 definitions"
      answer_type: choice
      options: [provider, deployer, importer, distributor, authorised_representative, gpai_provider]
    is_high_risk:
      question: "Is this AI system high-risk under the EU AI Act (Art. 6 and Annex III)?"
      context: "High-risk classification triggers the Chapter III \xA72 obligation stack."
      priority: high
      fact_key: is_high_risk
      citation: "EU AI Act Art. 6; Annex III"
      answer_type: bool
    system_category:
      question: "How is the system classified \u2014 high_risk, limited_risk, minimal_risk, prohibited,\
  \ gpai, or gpai_systemic?"
      context: "Risk category gates the obligation set; prohibited and minimal_risk exit most pipelines."
      priority: high
      fact_key: system_category
      citation: "EU AI Act Art. 5, 6, 50; Annex III"
      answer_type: choice
      options: [high_risk, limited_risk, minimal_risk, prohibited, gpai, gpai_systemic]
sections:
  - id: general_description
    title: 1. General Description of the AI System
    word_budget: 400
    citations: ["Annex IV(1)"]
    instructions: >-
      Provide: intended purpose, provider name, version, how the
      system interacts with hardware/software not part of it, relevant
      versions of software/firmware, description of all forms in which
      it is placed on the market or put into service, description of
      the hardware on which it is intended to run, photographs /
      illustrations if relevant, basic description of the user
      interface, and instructions for use for the deployer (cross-ref
      Art 13 recipe).
  - id: detailed_description_of_elements
    title: 2. Detailed Description of System Elements and Development Process
    word_budget: 600
    citations: ["Annex IV(2)"]
    instructions: >-
      Cover: methods and steps for development, including (where
      relevant) recourse to pre-trained systems or tools provided by
      third parties; design specifications including general logic;
      key design choices and assumptions; main classification choices
      and what the system is designed to optimise for; description of
      expected output and output quality; system architecture; data
      requirements in terms of datasheets describing the training
      methodologies and training data sets; assessment of human
      oversight measures per Art 14; where applicable, a detailed
      description of predetermined changes and technical solutions
      adopted to ensure continuous compliance; validation and testing
      procedures used, including information about metrics applied.
  - id: monitoring_functioning_control
    title: 3. Monitoring, Functioning, Control
    word_budget: 250
    citations: ["Annex IV(3)"]
    instructions: >-
      Detailed information about the monitoring, functioning and
      control of the system, in particular with regard to its
      capabilities and limitations in performance, expected level of
      accuracy, risks to health/safety/fundamental rights, human
      oversight measures, and input-data specifications.
  - id: risk_management_summary
    title: 4. Risk Management System Summary
    word_budget: 200
    citations: ["Annex IV(4)", "Article 9"]
    instructions: >-
      Detailed description of the risk management system per Art 9.
      This section cross-references the full RMS file produced by the
      eu_ai_act_art_9_risk_management_system recipe — summarise
      methodology, residual risks, and review cadence here.
  - id: lifecycle_changes
    title: 5. Lifecycle Changes
    word_budget: 150
    citations: ["Annex IV(5)"]
    instructions: >-
      Description of any change made to the system through its
      lifecycle. Include the version log and the rationale for each
      substantial modification per Art 43(4).
  - id: harmonised_standards_applied
    title: 6. Harmonised Standards and Common Specifications Applied
    word_budget: 200
    citations: ["Annex IV(6)", "Article 40", "Article 41"]
    instructions: >-
      List all harmonised standards applied in full or in part (with
      references published in the Official Journal). Where none were
      applied, describe the solutions adopted to meet the Section 2
      requirements. List any common specifications per Art 41 applied.
  - id: declaration_of_conformity_copy
    title: 7. Copy of the EU Declaration of Conformity
    word_budget: 80
    citations: ["Annex IV(7)", "Article 47", "Annex V"]
    instructions: >-
      Include a copy of the signed EU Declaration of Conformity
      produced by the eu_ai_act_art_47_eu_declaration_of_conformity
      recipe, with its document ID and date.
  - id: post_market_plan
    title: 8. Post-market Monitoring Plan
    word_budget: 200
    citations: ["Annex IV(8)", "Article 72"]
    instructions: >-
      Detailed description of the system in place to evaluate the
      system's performance in the post-market phase per Art 72,
      including the post-market monitoring plan and its reporting
      cadence. Cross-reference the eu_ai_act_art_72 recipe.
  - id: evidence_index
    title: 9. Evidence Index
    word_budget: 150
    instructions: >-
      Index every supporting artefact cited in sections 1–8 (dataset
      cards, model cards, test reports, audit logs, FRIA, DPIA,
      management-review minutes) with document IDs, hashes, and
      storage locations. This is the binder auditors and notified
      bodies will pull from.
