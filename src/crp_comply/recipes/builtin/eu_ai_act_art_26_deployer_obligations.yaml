recipe_id: eu_ai_act_art_26_deployer_obligations
title: EU AI Act — Deployer Obligations Checklist (Art. 26)
regulation: EU AI Act — Regulation (EU) 2024/1689
version: "1.0"
description: >-
  Article 26 sets out the obligations of deployers of high-risk AI
  systems. This recipe produces the deployer obligations checklist
  demonstrating compliance for a given deployment.
required_inputs:
  - deployer
  - system_id
  - intended_purpose
  - deployment_context
ckf_queries:
  - "intended purpose declared by provider"
  - "instructions for use received"
  - "affected workers and representatives consulted"
tools_allowed:
  - query_regulation
  - query_regulation_packed
  - recall_facts
  - lookup_article
tags: [ai_act, deployer, art26, high_risk]
output_format: both
output_artefacts:
  - Deployer Obligations Checklist (Art. 26)
applicability:
  purpose: >-
    Evidence that a deployer of a high-risk AI system is operating it
    per the instructions for use, has assigned human oversight, is
    monitoring operation, retaining logs, informing workers where
    applicable, and cooperating with authorities.
  triggers:
    - "Before putting a high-risk AI system into use"
    - "Upon new deployment context or workforce rollout"
  deadline: "Before first use and maintained throughout deployment"
  actors: [deployer]
  applies_when:
    - "actor=deployer"
    - "is_high_risk"
  not_applicable_when:
    - "actor=provider"
    - "actor=distributor"
    - "actor=importer"
  ask_when_unknown:
    actor:
      question: "Which role does your organisation play for this AI system \u2014 provider, deployer,\
  \ importer, distributor, authorised representative, or GPAI provider?"
      context: "Many EU AI Act obligations land on specific roles; the wrong actor classification\
  \ will mis-apply this recipe."
      priority: high
      fact_key: actor
      citation: "EU AI Act Art. 3 definitions"
      answer_type: choice
      options: [provider, deployer, importer, distributor, authorised_representative, gpai_provider]
    is_high_risk:
      question: "Is this AI system high-risk under the EU AI Act (Art. 6 and Annex III)?"
      context: "High-risk classification triggers the Chapter III \xA72 obligation stack."
      priority: high
      fact_key: is_high_risk
      citation: "EU AI Act Art. 6; Annex III"
      answer_type: bool
sections:
  - id: technical_and_organisational_measures
    title: 1. Technical and Organisational Measures in Line with Instructions for Use
    word_budget: 250
    citations: ["Article 26(1)"]
    instructions: >-
      Confirm appropriate technical and organisational measures are
      taken to ensure the system is used in accordance with the
      instructions for use accompanying it (Art 13).
  - id: human_oversight_assignment
    title: 2. Human Oversight Assignment
    word_budget: 200
    citations: ["Article 26(2)"]
    instructions: >-
      Assign human oversight to natural persons who have the
      necessary competence, training and authority, and necessary
      support.
  - id: input_data_relevance
    title: 3. Input Data Relevance and Representativeness
    word_budget: 150
    citations: ["Article 26(4)"]
    instructions: >-
      To the extent the deployer exercises control over the input
      data, ensure the input data is relevant and sufficiently
      representative in view of the intended purpose.
  - id: monitoring_and_suspension
    title: 4. Monitoring of Operation and Suspension Triggers
    word_budget: 250
    citations: ["Article 26(5)"]
    instructions: >-
      Monitor the operation of the system on the basis of the
      instructions for use, and inform the provider and the market
      surveillance authority of serious incidents or malfunctions
      without undue delay; suspend use where necessary.
  - id: log_retention
    title: 5. Log Retention
    word_budget: 150
    citations: ["Article 26(6)", "Article 12"]
    instructions: >-
      Keep the logs automatically generated by the system, to the
      extent such logs are under control, for at least six months
      (or longer when required by other Union / national law).
  - id: worker_information
    title: 6. Information to Workers and their Representatives
    word_budget: 150
    citations: ["Article 26(7)"]
    instructions: >-
      Before putting into service or using a high-risk system in the
      workplace, deployers who are employers shall inform workers'
      representatives and the affected workers that they will be
      subject to the use of the high-risk AI system.
  - id: registration_and_fria_link
    title: 7. EU Database Registration and FRIA Cross-Reference
    word_budget: 150
    citations: ["Article 26(8)", "Article 27", "Article 49"]
    instructions: >-
      Where applicable, register usage in the EU database per Art 49,
      and cross-reference the FRIA produced via the
      eu_ai_act_art_27_fria recipe where Art 27 applies.
  - id: information_to_natural_persons
    title: 8. Information to Natural Persons Subject to the System
    word_budget: 150
    citations: ["Article 26(11)", "Article 50"]
    instructions: >-
      Where a decision is taken with respect to a natural person on
      the basis of output from the system, inform them accordingly.
      Cross-reference Art 50 transparency notices where applicable.
  - id: cooperation_and_sign_off
    title: 9. Cooperation with Authorities and Sign-Off
    word_budget: 100
    citations: ["Article 26(12)"]
    instructions: >-
      State how the deployer cooperates with competent authorities in
      any action taken in relation to the system. Sign-off line.
