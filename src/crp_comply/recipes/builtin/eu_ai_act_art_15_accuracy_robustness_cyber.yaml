recipe_id: eu_ai_act_art_15_accuracy_robustness_cyber
title: EU AI Act — Accuracy, Robustness, Cybersecurity (Art. 15)
regulation: EU AI Act — Regulation (EU) 2024/1689
version: "1.0"
description: >-
  Article 15 requires high-risk AI systems to be designed and
  developed in such a way that they achieve an appropriate level of
  accuracy, robustness and cybersecurity, and to perform consistently
  in those respects throughout their lifecycle. This recipe produces
  the accuracy / robustness / cybersecurity statement.
required_inputs:
  - provider
  - system_id
  - intended_purpose
ckf_queries:
  - "performance benchmarks and test datasets"
  - "known failure modes and feedback loops"
  - "adversarial testing history"
tools_allowed:
  - query_regulation
  - query_regulation_packed
  - recall_facts
  - lookup_article
tags: [ai_act, accuracy, robustness, cybersecurity, art15, high_risk]
output_format: both
output_artefacts:
  - Accuracy, Robustness, Cybersecurity (Art. 15)
applicability:
  purpose: >-
    Declare the accuracy levels, robustness measures and cybersecurity
    controls achieved so that deployers and authorities can evaluate
    whether the high-risk system performs consistently and resists
    foreseeable attacks throughout its lifecycle.
  triggers:
    - "Before placement on market"
    - "Upon material change to model, data, or threat landscape"
  deadline: "Before placement on market"
  actors: [provider]
  applies_when:
    - "actor=provider"
    - "is_high_risk"
  not_applicable_when:
    - "actor=deployer"
  ask_when_unknown:
    actor:
      question: "Which role does your organisation play for this AI system \u2014 provider, deployer,\
  \ importer, distributor, authorised representative, or GPAI provider?"
      context: "Many EU AI Act obligations land on specific roles; the wrong actor classification\
  \ will mis-apply this recipe."
      priority: high
      fact_key: actor
      citation: "EU AI Act Art. 3 definitions"
      answer_type: choice
      options: [provider, deployer, importer, distributor, authorised_representative, gpai_provider]
    is_high_risk:
      question: "Is this AI system high-risk under the EU AI Act (Art. 6 and Annex III)?"
      context: "High-risk classification triggers the Chapter III \xA72 obligation stack."
      priority: high
      fact_key: is_high_risk
      citation: "EU AI Act Art. 6; Annex III"
      answer_type: bool
sections:
  - id: accuracy_levels
    title: 1. Declared Accuracy Levels and Metrics
    word_budget: 300
    citations: ["Article 15(1)", "Article 15(3)"]
    instructions: >-
      Declare the relevant accuracy metrics (e.g. precision, recall,
      F1, calibration, mean-error) with numeric levels reached during
      validation. State how these levels are communicated to deployers
      via the instructions for use (Art 13).
  - id: robustness_technical_redundancy
    title: 2. Robustness and Technical Redundancy
    word_budget: 300
    citations: ["Article 15(4)"]
    instructions: >-
      Describe the technical and organisational measures ensuring
      robustness against errors, faults or inconsistencies that may
      occur within the system or the environment in which it operates.
      Cover backup plans, redundancy, fail-safes.
  - id: feedback_loop_mitigation
    title: 3. Feedback-Loop Mitigation (continuous learning)
    word_budget: 200
    citations: ["Article 15(4)"]
    instructions: >-
      High-risk systems that continue to learn after being placed on
      the market or put into service shall be developed to eliminate
      or reduce, as far as possible, the risk of biased outputs
      influencing input for future operations (feedback loops), and
      to ensure any such feedback loops are duly addressed with
      appropriate mitigation measures.
  - id: cybersecurity_controls
    title: 4. Cybersecurity Controls
    word_budget: 400
    citations: ["Article 15(5)"]
    instructions: >-
      Describe the cybersecurity controls put in place to resist
      attempts by unauthorised third parties to alter use, outputs or
      performance by exploiting vulnerabilities. Cover: data
      poisoning, model poisoning (training-data manipulation),
      model evasion (adversarial examples), confidentiality attacks,
      model flaws, and measures to prevent, detect, respond to,
      resolve and control such attacks. Map controls to ISO/IEC
      27001/5 and NIS2 where relevant.
  - id: testing_and_benchmarks
    title: 5. Testing, Benchmarks and Real-world Validation
    word_budget: 300
    citations: ["Article 15(2)", "Article 15(3)"]
    instructions: >-
      Describe the testing and benchmark procedures used. Where
      relevant, reference the Commission's encouraged development of
      benchmarks and measurement methodologies.
  - id: lifecycle_consistency
    title: 6. Lifecycle Consistency Controls
    word_budget: 150
    citations: ["Article 15(1)"]
    instructions: >-
      State how accuracy, robustness and cybersecurity are kept
      consistent throughout the lifecycle (drift monitoring, re-test
      cadence, version gating) and integrated with Art 72 post-market
      monitoring.
  - id: sign_off
    title: 7. Sign-Off
    word_budget: 80
    instructions: Signatory (CISO or designated technical lead), date, next review.
