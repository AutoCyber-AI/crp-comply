recipe_id: eu_ai_act_art_47_eu_declaration_of_conformity
title: EU AI Act — EU Declaration of Conformity (Art. 47 + Annex V)
regulation: EU AI Act — Regulation (EU) 2024/1689
version: "1.0"
description: >-
  Providers of high-risk AI systems must draw up a written,
  machine-readable, physical or electronically signed EU Declaration
  of Conformity for each system and keep it at the disposal of
  national authorities for 10 years. Content is fixed by Annex V.
required_inputs:
  - provider
  - system_id
  - version
ckf_queries:
  - "conformity assessment outcome for this version"
  - "notified body involved, if any"
  - "harmonised standards applied"
tools_allowed:
  - query_regulation
  - query_regulation_packed
  - recall_facts
  - lookup_article
  - lookup_annex
tags: [ai_act, doc, eu_declaration_of_conformity, art47, annex_v, high_risk]
output_format: both
output_artefacts:
  - EU Declaration of Conformity (Art. 47 + Annex V)
applicability:
  purpose: >-
    The EU Declaration of Conformity is the provider's formal
    attestation that a high-risk AI system conforms with the
    Regulation; it is kept at the disposal of national authorities
    for 10 years.
  triggers:
    - "Before placing a high-risk AI system on the market"
    - "Upon substantial modification requiring re-assessment"
  deadline: "Before placement on market; retained 10 years"
  actors: [provider]
  applies_when:
    - "actor=provider"
    - "is_high_risk"
  not_applicable_when:
    - "actor=deployer"
  ask_when_unknown:
    actor:
      question: "Which role does your organisation play for this AI system \u2014 provider, deployer,\
  \ importer, distributor, authorised representative, or GPAI provider?"
      context: "Many EU AI Act obligations land on specific roles; the wrong actor classification\
  \ will mis-apply this recipe."
      priority: high
      fact_key: actor
      citation: "EU AI Act Art. 3 definitions"
      answer_type: choice
      options: [provider, deployer, importer, distributor, authorised_representative, gpai_provider]
    is_high_risk:
      question: "Is this AI system high-risk under the EU AI Act (Art. 6 and Annex III)?"
      context: "High-risk classification triggers the Chapter III \xA72 obligation stack."
      priority: high
      fact_key: is_high_risk
      citation: "EU AI Act Art. 6; Annex III"
      answer_type: bool
sections:
  - id: system_identification
    title: 1. System Name, Type and Traceability Reference
    word_budget: 100
    citations: ["Annex V(1)"]
    instructions: >-
      AI system name and, where appropriate, type and any additional
      unambiguous reference allowing identification and traceability.
  - id: provider_identification
    title: 2. Provider / Authorised Representative Identification
    word_budget: 100
    citations: ["Annex V(2)"]
    instructions: >-
      Name and address of the provider and, where applicable, of their
      authorised representative.
  - id: sole_responsibility_statement
    title: 3. Statement of Sole Responsibility
    word_budget: 80
    citations: ["Annex V(3)"]
    instructions: >-
      Statement that the EU Declaration of Conformity is issued under
      the sole responsibility of the provider.
  - id: conformity_statement
    title: 4. Conformity Statement and References
    word_budget: 150
    citations: ["Annex V(4)"]
    instructions: >-
      Statement that the AI system is in conformity with this
      Regulation and, where applicable, any other relevant Union law.
      List Union acts applied (e.g. GDPR, Medical Devices Regulation,
      Machinery Directive) where the system is a safety component.
  - id: personal_data_reference
    title: 5. Reference to GDPR / Law Enforcement Directive
    word_budget: 80
    citations: ["Annex V(5)"]
    instructions: >-
      Where the AI system involves the processing of personal data,
      a statement that the system complies with Regulations (EU)
      2016/679 and (EU) 2018/1725 and Directive (EU) 2016/680.
  - id: standards_applied
    title: 6. References to Harmonised Standards or Common Specifications Applied
    word_budget: 100
    citations: ["Annex V(6)"]
    instructions: >-
      References to any relevant harmonised standards used or any
      other common specification in relation to which conformity is
      declared.
  - id: notified_body
    title: 7. Notified Body Details (if applicable)
    word_budget: 100
    citations: ["Annex V(7)"]
    instructions: >-
      Where applicable, the name and identification number of the
      notified body, a description of the conformity assessment
      procedure performed, and identification of the certificate
      issued.
  - id: place_and_date_of_issue
    title: 8. Place and Date of Issue, Signatory
    word_budget: 80
    citations: ["Annex V(8)"]
    instructions: >-
      Place and date of issue of the declaration, name and function
      of the person signing it, and signature.
