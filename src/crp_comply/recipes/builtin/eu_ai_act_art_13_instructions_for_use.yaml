recipe_id: eu_ai_act_art_13_instructions_for_use
title: EU AI Act — Transparency & Instructions for Use (Art. 13)
regulation: EU AI Act — Regulation (EU) 2024/1689
version: "1.0"
description: >-
  Providers of high-risk AI systems must design and develop them so
  that their operation is sufficiently transparent to enable deployers
  to interpret outputs and use them appropriately, and must accompany
  them with instructions for use. This recipe produces the IFU
  document per Article 13.
required_inputs:
  - provider
  - system_id
  - version
  - intended_purpose
ckf_queries:
  - "known performance metrics for this system"
  - "known limitations and failure modes"
  - "deployer categories served"
tools_allowed:
  - query_regulation
  - query_regulation_packed
  - recall_facts
  - lookup_article
tags: [ai_act, transparency, art13, instructions_for_use, high_risk]
output_format: both
output_artefacts:
  - Transparency & Instructions for Use (Art. 13)
applicability:
  purpose: >-
    Every high-risk AI system must be accompanied by Instructions for
    Use enabling deployers to interpret outputs and operate the system
    safely. This is a mandatory provider artefact.
  triggers:
    - "Before placing a high-risk AI system on the EU market"
    - "On every version release that changes performance characteristics"
  deadline: "Before placement on market / putting into service"
  actors: [provider]
  applies_when:
    - "actor=provider"
    - "is_high_risk"
  not_applicable_when:
    - "actor=deployer"
  ask_when_unknown:
    actor:
      question: "Which role does your organisation play for this AI system \u2014 provider, deployer,\
  \ importer, distributor, authorised representative, or GPAI provider?"
      context: "Many EU AI Act obligations land on specific roles; the wrong actor classification\
  \ will mis-apply this recipe."
      priority: high
      fact_key: actor
      citation: "EU AI Act Art. 3 definitions"
      answer_type: choice
      options: [provider, deployer, importer, distributor, authorised_representative, gpai_provider]
    is_high_risk:
      question: "Is this AI system high-risk under the EU AI Act (Art. 6 and Annex III)?"
      context: "High-risk classification triggers the Chapter III \xA72 obligation stack."
      priority: high
      fact_key: is_high_risk
      citation: "EU AI Act Art. 6; Annex III"
      answer_type: bool
sections:
  - id: provider_identity
    title: 1. Identity and Contact of the Provider
    word_budget: 100
    citations: ["Article 13(3)(a)"]
    instructions: >-
      Identity and the contact details of the provider and, where
      applicable, of its authorised representative.
  - id: characteristics_capabilities_limits
    title: 2. Characteristics, Capabilities and Limitations of Performance
    word_budget: 500
    citations: ["Article 13(3)(b)"]
    instructions: >-
      Provide: intended purpose; level of accuracy, robustness and
      cybersecurity against which the system has been tested and
      validated (metrics); any known or foreseeable circumstance that
      may lead to risks to health/safety/fundamental rights; technical
      capabilities and characteristics relevant to explain output;
      when appropriate, performance regarding specific persons or
      groups; specifications for input data; information to enable
      deployers to interpret output.
  - id: changes_and_updates
    title: 3. Changes Pre-Determined by the Provider
    word_budget: 150
    citations: ["Article 13(3)(c)"]
    instructions: >-
      Changes to the system and its performance which have been
      pre-determined by the provider at the moment of initial
      conformity assessment, if any.
  - id: human_oversight_instructions
    title: 4. Human Oversight Measures
    word_budget: 250
    citations: ["Article 13(3)(d)", "Article 14"]
    instructions: >-
      The human oversight measures referred to in Article 14,
      including the technical measures put in place to facilitate the
      interpretation of outputs by deployers.
  - id: resources_and_maintenance
    title: 5. Expected Lifetime and Maintenance
    word_budget: 150
    citations: ["Article 13(3)(e)", "Article 13(3)(f)"]
    instructions: >-
      Computational and hardware resources needed, expected lifetime
      of the system, and any necessary maintenance and care measures,
      including their frequency, to ensure proper functioning,
      including software updates.
  - id: logging_description
    title: 6. Description of Logging Mechanisms
    word_budget: 150
    citations: ["Article 13(3)(f)", "Article 12"]
    instructions: >-
      Where relevant, description of the mechanisms included within
      the system that allow deployers to properly collect, store and
      interpret the logs produced per Article 12.
  - id: sign_off
    title: 7. Version, Date and Sign-Off
    word_budget: 80
    instructions: >-
      Document version, date of issue, and the accountable signatory
      (product owner / compliance lead).
