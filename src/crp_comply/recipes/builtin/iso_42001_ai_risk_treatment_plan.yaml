recipe_id: iso_42001_ai_risk_treatment_plan
title: ISO/IEC 42001 — AI Risk Treatment Plan (Clause 6.1.3)
regulation: ISO/IEC 42001:2023
version: "1.0"
description: >-
  Clause 6.1.3 requires the organisation to define and apply an AI
  risk-treatment process. This recipe produces the AI Risk Treatment
  Plan, including selection of controls from Annex A, the Statement
  of Applicability, and owners / due-dates for residual-risk
  acceptance.
required_inputs:
  - organisation
  - risk_assessment_reference
ckf_queries:
  - "selected Annex A controls and rationale"
  - "residual-risk acceptances from prior cycles"
tools_allowed:
  - query_regulation
  - query_regulation_packed
  - recall_facts
  - lookup_article
tags: [iso_42001, risk_treatment, clause_6_1_3, annex_a]
output_format: both
output_artefacts:
  - AI Risk Treatment Plan (Clause 6.1.3)
applicability:
  purpose: >-
    Clause 6.1.3 requires a documented plan that selects controls,
    assigns ownership, accepts residual risk, and is tracked to
    completion. Pairs with the Statement of Applicability.
  triggers:
    - "After each AI risk assessment cycle"
    - "Upon acceptance of new residual risks"
  deadline: "Before operational deployment of treatment"
  actors: [any]
  applies_when: []
  not_applicable_when: []
  ask_when_unknown:
    actor:
      question: "Which role does your organisation play for this AI system \u2014 provider, deployer,\
  \ importer, distributor, authorised representative, or GPAI provider?"
      context: "Many EU AI Act obligations land on specific roles; the wrong actor classification\
  \ will mis-apply this recipe."
      priority: high
      fact_key: actor
      citation: "EU AI Act Art. 3 definitions"
      answer_type: choice
      options: [provider, deployer, importer, distributor, authorised_representative, gpai_provider]
    is_high_risk:
      question: "Is this AI system high-risk under the EU AI Act (Art. 6 and Annex III)?"
      context: "High-risk classification triggers the Chapter III \xA72 obligation stack."
      priority: high
      fact_key: is_high_risk
      citation: "EU AI Act Art. 6; Annex III"
      answer_type: bool
    iso_42001_certified:
      question: "Is your organisation certified against ISO/IEC 42001 (AI management system)?"
      context: "Certification changes the evidence pattern for several recipes."
      priority: low
      fact_key: iso_42001_certified
      citation: "ISO/IEC 42001"
      answer_type: bool
sections:
  - id: treatment_options_selection
    title: 1. Risk Treatment Options
    word_budget: 200
    citations: ["Clause 6.1.3(a)"]
    instructions: >-
      For each risk needing treatment, select the treatment option
      (avoid, modify via controls, share, retain) with rationale.
  - id: controls_determination
    title: 2. Controls Necessary to Implement the Treatment
    word_budget: 300
    citations: ["Clause 6.1.3(b)", "Annex A"]
    instructions: >-
      Determine all controls necessary to implement the selected
      option(s) and compare them against ISO/IEC 42001 Annex A
      (A.2.2 – A.10.4). Identify any additional controls beyond
      Annex A where required.
  - id: statement_of_applicability_link
    title: 3. Statement of Applicability Cross-Reference
    word_budget: 150
    citations: ["Clause 6.1.3(d)"]
    instructions: >-
      Produce / update the Statement of Applicability (recipe
      iso_42001_statement_of_applicability) stating for each Annex A
      control whether it is included / excluded, the justification,
      and implementation status.
  - id: treatment_plan
    title: 4. Risk Treatment Plan
    word_budget: 300
    citations: ["Clause 6.1.3(e)"]
    instructions: >-
      Tabular plan: risk ID, selected controls, implementation
      actions, responsible owner, resources, due date, progress
      indicator.
  - id: residual_risk_acceptance
    title: 5. Residual-Risk Acceptance
    word_budget: 200
    citations: ["Clause 6.1.3(f)"]
    instructions: >-
      For each residual risk, the accountable risk-owner approval,
      with rationale against the acceptance criteria from Clause 6.1.1.
  - id: monitoring_and_update
    title: 6. Monitoring and Update Cadence
    word_budget: 150
    citations: ["Clause 9.1", "Clause 8.3"]
    instructions: >-
      How the plan is monitored (Clause 9.1) and updated (Clause
      8.3 operational risk treatment).
  - id: sign_off
    title: 7. Sign-Off
    word_budget: 80
    instructions: Approver (top management delegate), date, next review.
