# Railway deployment recipe for crp-comply-searxng.
#
# IMPORTANT: configure this service WITHOUT public networking.
# It must be reachable ONLY via Railway's internal DNS, e.g.
#   http://crp-comply-searxng.railway.internal:8080
# crp-comply-search reads CRP_COMPLY_SEARXNG_URL pointing here.

[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

[deploy]
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 5
healthcheckPath = "/healthz"
healthcheckTimeout = 300
numReplicas = 1
