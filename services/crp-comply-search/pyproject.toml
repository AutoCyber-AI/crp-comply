[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "crp-comply-search"
version = "0.1.0"
description = "Web search sidecar for crp-comply (PHASE_7 §7.8)."
requires-python = ">=3.11"
readme = "README.md"
license = { text = "BUSL-1.1" }
authors = [{ name = "crp-comply" }]

dependencies = [
    "fastapi>=0.110,<1",
    "uvicorn[standard]>=0.27,<1",
    "httpx>=0.27,<1",
    "beautifulsoup4>=4.12,<5",
    "pyyaml>=6.0,<7",
    "ddgs>=9.0,<10",
    "prometheus-client>=0.20,<1",
    "pydantic>=2.5,<3",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "respx>=0.20"]

[project.scripts]
crp-comply-search = "crp_comply_search.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"crp_comply_search" = ["profiles/*.yaml"]
